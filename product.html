<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jewellery | Sri Chandana Jewellers</title>
  <meta name="theme-color" content="#861543">
  <link rel="icon" type="image/png" href="assets/favicon.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="product">
  <div id="site-header"></div>
  <main id="main" class="wrap">
    <nav class="crumbs dark" aria-label="Breadcrumb" id="crumbs"></nav>
    <div id="pdp"></div>
    <section style="padding-bottom:80px" id="similarWrap">
      <div class="row-head"><div><span class="eyebrow">You may also like</span><h2>Similar Designs</h2></div><a class="link" id="moreLink" href="shop.html">View all</a></div>
      <div class="grid" id="similar"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/store.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/live-rate.js"></script>
  <script src="js/layout.js"></script>
  <script>
  SCJ.ready.then(function () {
    const { $, $$, esc, icon, card, toast } = UI;
    const id = new URLSearchParams(location.search).get('id');
    const p = SCJ.product(id) || SCJ.db.products[0];
    const pr = SCJ.priceOf(p);
    document.title = p.name + ' | Sri Chandana Jewellers';
    const metalLabel = p.purity === '925' ? 'Sterling Silver 925' : `${p.purity} ${p.metal === 'Silver' ? 'Silver' : 'Gold'}`;
    const isRing = p.category === 'Rings', isBangle = p.category === 'Bangles';
    const sizes = isRing ? ['10', '12', '14', '16', '18', '20'] : isBangle ? ['2.4', '2.6', '2.8', '2.10'] : [];

    $('#crumbs').innerHTML = `<a href="index.html">Home</a><span>/</span><a href="shop.html?category=${encodeURIComponent(p.category)}">${esc(p.category)}</a><span>/</span><span aria-current="page">${esc(p.name)}</span>`;
    $('#pdp').innerHTML = `<div class="pdp">
      <div class="gallery">
        <div class="thumbs" role="group" aria-label="Product images">${p.images.map((src, i) => `<button data-img="${i}" aria-label="Show image ${i + 1}" aria-current="${i === 0}"><img src="${src.replace('w=800', 'w=160')}" alt=""></button>`).join('')}</div>
        <div class="main-img" id="mainImg"><img src="${p.images[0].replace('w=800', 'w=1200')}" alt="${esc(p.name)}" width="1200" height="1200"></div>
      </div>
      <div class="pdp-info">
        <span class="eyebrow">${esc(p.collection)} Collection</span>
        <h1>${esc(p.name)}</h1>
        <span class="sku">SKU ${p.id}</span>
        ${p.hidePrice ? `<div class="pdp-price"><strong class="ask">Price on request</strong><small>Priced at the day's gold rate</small></div>
        <p style="font-size:13px;color:var(--muted);margin:0">Message us on WhatsApp or call ${esc(SCJ.db.settings.phone)} for today's price.</p>` : `<div class="pdp-price"><strong>${SCJ.inr(pr.total)}</strong><small>MRP incl. of all taxes</small></div>
        <p style="font-size:13px;color:var(--muted);margin:0">Price at today's ${p.purity === '925' ? 'silver' : p.purity} rate of ${SCJ.inr(pr.rate)}/g. Final price may vary slightly with actual weight.</p>`}
        <div class="spec-pills"><span>Metal <b>${metalLabel}</b></span>${p.grossWeight ? `<span>Gross wt <b>${p.grossWeight} g</b></span><span>Net wt <b>${p.weight} g</b></span>` : `<span>Weight <b>${p.weight} g</b></span>`}${p.stoneValue ? `<span>Stones <b>${p.metal === 'Diamond' ? 'Certified diamonds' : 'Precious stones'}</b></span>` : ''}<span>For <b>${esc(p.gender)}</b></span></div>
        ${sizes.length ? `<div class="field"><span class="label" id="sizeLbl">${isRing ? 'Ring size' : 'Bangle size'}</span><div class="sizes" role="group" aria-labelledby="sizeLbl">${sizes.map(s => `<button type="button" data-size="${s}" aria-pressed="false">${s}</button>`).join('')}</div><span class="hint">Not sure? <a href="#" data-book="${esc(p.name)}" style="text-decoration:underline">Get help with sizing</a></span></div>` : ''}
        <div class="buy-row">
          ${p.hidePrice ? `<a class="btn btn-primary" style="flex:1" href="${UI.askLink(p)}" target="_blank" rel="noopener">${icon('phone', 'icon-sm')} Ask Price on WhatsApp</a>` : `<button class="btn btn-primary" id="addBag">${icon('bag', 'icon-sm')} Add to Bag</button>
          <button class="btn btn-outline" id="buyNow">Buy Now</button>`}
          <button class="wish-btn" data-wish="${p.id}" aria-pressed="${SCJ.wish.has(p.id)}" aria-label="Wishlist">${icon('heart', 'icon-sm')}</button>
        </div>
        <div class="btn-row" style="margin-bottom:20px">
          <button class="btn btn-outline" style="flex:1" data-book="${esc(p.name)}">${icon('video', 'icon-sm')} Video Call</button>
          <a class="btn btn-outline" style="flex:1;border-color:#1FA855;color:#167A3E" target="_blank" rel="noopener" href="https://wa.me/${SCJ.db.settings.whatsapp}?text=${encodeURIComponent('Hi, I am interested in ' + p.name + ' (' + p.id + ') — ' + location.href)}">WhatsApp Enquiry</a>
        </div>
        <label class="label" for="pin">Check delivery</label>
        <div class="pin-check" style="margin-top:6px"><input id="pin" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit pincode" autocomplete="postal-code"><button class="btn btn-outline" id="pinBtn" style="min-height:46px">Check</button></div>
        <div class="pin-msg" id="pinMsg" aria-live="polite"></div>
        <div class="perks">
          <div>${icon('shield', 'icon-sm')}BIS Hallmark · HUID</div><div>${icon('refresh', 'icon-sm')}Old gold exchange</div>
          <div>${icon('truck', 'icon-sm')}Reserve online</div><div>${icon('store', 'icon-sm')}Free pickup at store</div>
        </div>
        <details class="acc" open ${p.hidePrice ? 'hidden' : ''}><summary>Price Breakup</summary><div class="acc-body"><table class="breakup">
          <tr><td>${p.purity === '925' ? 'Silver' : 'Gold'} value (${p.weight}g × ${SCJ.inr(pr.rate)})</td><td>${SCJ.inr(pr.metal)}</td></tr>
          <tr><td>Making charges (${p.making}%)</td><td>${SCJ.inr(pr.making)}</td></tr>
          ${pr.stone ? `<tr><td>${p.metal === 'Diamond' ? 'Diamond' : 'Stone'} value</td><td>${SCJ.inr(pr.stone)}</td></tr>` : ''}
          <tr><td>GST (3%)</td><td>${SCJ.inr(pr.gst)}</td></tr>
          <tr><td>Total</td><td>${SCJ.inr(pr.total)}</td></tr></table></div></details>
        <details class="acc"><summary>Product Details</summary><div class="acc-body"><p>${esc(p.description)}</p>
          <table class="breakup"><tr><td>Product code</td><td>${p.id}</td></tr><tr><td>Category</td><td>${esc(p.category)}</td></tr><tr><td>Metal / Purity</td><td>${metalLabel}</td></tr>${p.grossWeight ? `<tr><td>Gross weight</td><td>${p.grossWeight} g</td></tr><tr><td>Net weight</td><td>${p.weight} g</td></tr>` : `<tr><td>Gross weight</td><td>${p.weight} g</td></tr>`}<tr><td>Collection</td><td>${esc(p.collection)}</td></tr></table></div></details>
        <details class="acc"><summary>Exchange & Buyback</summary><div class="acc-body"><p>Bring this piece back any time to exchange it for new jewellery at the day's gold rate. Please bring your original bill. Ask in store for current exchange terms.</p></div></details>
      </div></div>`;

    // gallery + zoom
    const main = $('#mainImg'), mainImg = main.querySelector('img');
    $$('[data-img]').forEach(b => b.addEventListener('click', () => { mainImg.src = p.images[+b.dataset.img].replace('w=800', 'w=1200'); $$('[data-img]').forEach(x => x.setAttribute('aria-current', x === b)); }));
    if (matchMedia('(hover: hover)').matches) {
      main.addEventListener('mousemove', e => { const r = main.getBoundingClientRect(); main.style.setProperty('--zx', ((e.clientX - r.left) / r.width * 100) + '%'); main.style.setProperty('--zy', ((e.clientY - r.top) / r.height * 100) + '%'); });
      main.addEventListener('mouseenter', () => main.classList.add('zoom')); main.addEventListener('mouseleave', () => main.classList.remove('zoom'));
    }

    let size = '';
    $$('[data-size]').forEach(b => b.addEventListener('click', () => { size = b.dataset.size; $$('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    const add = () => {
      if (sizes.length && !size) { toast('Please choose a size first'); $('[data-size]').focus(); return false; }
      SCJ.cart.add(p.id, 1, size); return true;
    };
    $('#addBag')?.addEventListener('click', () => { if (add()) { toast('Added to your bag'); UI.openDrawer('cartDrawer'); } });
    $('#buyNow')?.addEventListener('click', () => { if (add()) location.href = 'checkout.html'; });
    $('#pinBtn').addEventListener('click', () => {
      const v = $('#pin').value.trim(), m = $('#pinMsg');
      if (!/^[1-9][0-9]{5}$/.test(v)) { m.style.color = 'var(--err)'; m.textContent = 'Please enter a valid 6-digit pincode.'; return; }
      const local = v.startsWith('5355') || v.startsWith('5350');
      m.style.color = 'var(--ok)'; m.textContent = local ? '✓ Same-day delivery or free store pickup available in your area.' : '✓ Reserve online and collect at our Parvathipuram store, or call us to arrange delivery.';
    });

    const sim = SCJ.db.products.filter(x => x.id !== p.id && (x.category === p.category || x.collection === p.collection)).slice(0, 4);
    $('#similar').innerHTML = sim.map(card).join('');
    $('#moreLink').href = 'shop.html?category=' + encodeURIComponent(p.category);
    if (!sim.length) $('#similarWrap').hidden = true;
  });
  </script>
</body>
</html>
